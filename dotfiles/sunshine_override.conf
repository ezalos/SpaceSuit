# ABOUTME: Attaches Sunshine to the live GDM X session and ties its lifetime to that
# ABOUTME: session, so an X restart cannot leave it holding a dead display handle.
# See docs/plans/2026-08-01-sunshine-moonlight-handoff.md in ~/Setup.
[Unit]
# WantedBy alone only STARTS the unit with the target; systemd leaves an
# already-running service untouched when the target cycles. Without PartOf, an X
# restart (gdm3 restart, display reconfig) left Sunshine alive on a dead X
# connection and every capture failed with "Unable to find display or encoder"
# (Moonlight error 503) until a manual restart. Observed 2026-08-04.
PartOf=graphical-session.target

[Service]
# Display number moves between boots: autologin = :0, greeter login = :1.
Environment=DISPLAY=:0
Environment=XAUTHORITY=/run/user/1000/gdm/Xauthority
