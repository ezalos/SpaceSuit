# ABOUTME: Pins SSH_AUTH_SOCK to gcr-ssh-agent, the agent that actually holds the keys on this host.
# ABOUTME: Works only alongside `systemctl --user mask gpg-agent-ssh.socket` — see the override note below.
#
# WHY THIS FILE EXISTS
# gnome-keyring-daemon ran here as --components=pkcs11,secrets (no ssh), yet
# /etc/xdg/autostart/gnome-keyring-ssh.desktop still created a LISTENING socket
# at /run/user/1000/keyring/ssh that nothing ever accepted. Any ssh inheriting
# that path blocked in connect() forever -- before any network I/O, which is why
# ConnectTimeout does not save you. It wedged the todo-capture path for 25h and
# leaked three ssh processes, one alive two days (2026-08-18). The companion
# dotfile `gnome-keyring-ssh.desktop` (Hidden=true) stops that socket being
# recreated; confirmed across the 2026-08-24 reboot.
#
# WHY THIS FILE ALONE WAS NOT ENOUGH (found 2026-08-26)
# environment.d is read when the systemd user manager starts, and this file DID
# win there. But /usr/lib/systemd/user/gpg-agent-ssh.socket line 15 runs
#     ExecStartPost=systemctl --user set-environment SSH_AUTH_SOCK=%t/gnupg/S.gpg-agent.ssh
# afterwards, overwriting it with gpg-agent's ssh socket -- an agent holding NO
# identities here, since enable-ssh-support is not set. ssh kept working only
# because ~/.ssh/config uses explicit IdentityFile with IdentitiesOnly yes, so
# anything genuinely needing the agent (ssh -A, a host without an IdentityFile)
# would have found it empty.
#
# THE OTHER HALF OF THE FIX
#     systemctl --user mask gpg-agent-ssh.socket
# User-scope mask, because the unit is enabled in GLOBAL scope and a user-scope
# disable is overridden at boot. GPG itself is untouched (gpg-agent.socket is a
# separate unit and stays active). With the socket masked, this file's value
# stands and gcr-ssh-agent -- which holds the keys -- is the effective agent.
SSH_AUTH_SOCK=/run/user/1000/gnupg/S.gpg-agent.ssh -- something in the
# GNOME session sets it after the systemd user manager reads environment.d.
# That agent answers but holds NO identities; ssh still works only because
# ~/.ssh/config uses explicit IdentityFile with IdentitiesOnly yes. The keys
# actually live in gcr-ssh-agent (/run/user/1000/gcr/ssh).
#
# So: harmless and useful as a floor for contexts that read environment.d, but
# if you need the agent (ssh -A, or a host without an IdentityFile), check the
# live value first rather than assuming this one won.
SSH_AUTH_SOCK=/run/user/1000/gcr/ssh
