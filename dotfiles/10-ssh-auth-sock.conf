# ABOUTME: Pins SSH_AUTH_SOCK to the live gcr-ssh-agent instead of the dead gnome-keyring socket.
# ABOUTME: Without this, every ssh from a session-spawned process hangs forever in unix_wait_for_peer.
#
# gnome-keyring-daemon runs here as --components=pkcs11,secrets: no ssh
# component. It still holds a LISTENING socket on /run/user/1000/keyring/ssh
# (fd 13) that nothing ever accepts, so any ssh inheriting that path blocks in
# connect() until killed -- before any network I/O, which is why ConnectTimeout
# does not save you. Diagnosed 2026-08-18 after it wedged the todo-capture path
# for 25h and leaked three ssh processes (one alive for two days).
#
# The real agent is gcr-ssh-agent.socket, active and holding Louis's keys.
SSH_AUTH_SOCK=/run/user/1000/gcr/ssh
