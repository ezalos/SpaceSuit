# ABOUTME: tmux configuration for terminal multiplexer behavior, keybindings, and styling.
# ABOUTME: Deployed to all machines via the dotfiles manager (same config everywhere).
# Add this at the top of your config for better SSH compatibility
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Clipboard: accept OSC 52 from inner programs AND forward it to the outer terminal so the
# `copy` shell function reaches the LOCAL laptop clipboard over SSH (chains through nested tmux).
# REQUIRES tmux >= 3.3 on EVERY layer in the chain: app-clipboard forwarding did not exist in
# 3.2 and older (verified 2026-07-06: 3.2a captures but never forwards; 3.5a forwards + chains).
# terminal-features 'clipboard' marks the outer terminal OSC-52-capable (belt-and-suspenders).
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Extended keys: pass through CSI u sequences (e.g. Shift+Enter) to apps inside tmux
# 'on' sends CSI u only when the inner app requests it (avoids breaking nested tmux copy mode)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Also recognize extkeys from screen/tmux terminals (SSH from another tmux sends TERM=screen-256color)
set -as terminal-features 'screen*:extkeys'
set -as terminal-features 'tmux*:extkeys'

# Forward Shift+Enter as CSI u sequence to inner apps (e.g. Claude Code newline)
# Two mechanisms: user-keys catches the raw sequence before extkeys decodes it,
# S-Enter catches it when extkeys does decode it (tmux 3.2+)
set -s user-keys[0] "\e[13;2u"
bind-key -n User0 send-keys "\e[13;2u"
bind-key -n S-Enter send-keys "\e[13;2u"

# Forward Shift+Tab as CSI u sequence to inner apps (e.g. Claude Code plan mode)
# WezTerm sends \e[9;2u (not traditional \e[Z]) when DECSET 2017 is active,
# which tmux requested via extended-keys + terminal-features extkeys.
# Without this, tmux decodes S-Tab but can't re-encode it for non-extended-keys panes.
set -s user-keys[1] "\e[9;2u"
bind-key -n User1 send-keys "\e[9;2u"
bind-key -n S-Tab send-keys "\e[9;2u"

# Use vi-style key bindings in copy mode (auto-detected from $EDITOR on some machines,
# but setting explicitly ensures consistent behavior across all machines)
setw -g mode-keys vi

# Scrollback buffer size per pane (default is only 2000 lines).
# Only affects panes created after the setting is applied.
set -g history-limit 50000

# From: https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

########################################################
# MOUSE AND INPUT CONFIGURATION
########################################################

# Enable mouse control (clickable windows, panes, resizable panes)
# Use direct value instead of variable interpolation for better SSH compatibility
set -g mouse on

# https://github.com/NHDaly/tmux-better-mouse-mode
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# From: https://www.reddit.com/r/tmux/comments/wcp92t/how_can_i_use_the_mouse_scroll_wheel_to_move_up/
# Easy config reload
bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded."

# don't rename windows automatically
set-option -g allow-rename off

# Change prefix from Ctrl+b to Ctrl+a
set -g prefix C-a
unbind-key C-b
bind-key C-a send-prefix

########################################################
# PANE MANAGEMENT
########################################################

# New windows and splits open in the current pane's working directory
bind c new-window -c "#{pane_current_path}"

# split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# macOS via SSH: fn+Option+Arrow arrives as Shift+Alt+Arrow; bind it to pane switching.
# Frees Option+Arrow for shell word-nav (see wezterm.lua on macOS).
bind -n S-M-Left select-pane -L
bind -n S-M-Right select-pane -R
bind -n S-M-Up select-pane -U
bind -n S-M-Down select-pane -D

########################################################
# COPY MODE -> FAST -> [SHIFT + arrow keys]
########################################################

# Bind Shift+Up to half page up (like Ctrl+u)
bind-key -T copy-mode-vi S-Up send-keys -X halfpage-up
bind-key -T copy-mode S-Up send-keys -X halfpage-up

# Bind Shift+Down to half page down (like Ctrl+d)  
bind-key -T copy-mode-vi S-Down send-keys -X halfpage-down
bind-key -T copy-mode S-Down send-keys -X halfpage-down

# Optional: Bind Shift+Left/Right to full page movements
bind-key -T copy-mode-vi S-Left send-keys -X page-up
bind-key -T copy-mode S-Left send-keys -X page-up

bind-key -T copy-mode-vi S-Right send-keys -X page-down
bind-key -T copy-mode S-Right send-keys -X page-down

########################################################
# NOTIFICATIONS AND BELLS
########################################################

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

########################################################
# DISPLAY AND STYLING
########################################################

# clock mode
setw -g clock-mode-colour "yellow"

# copy mode
setw -g mode-style "fg=black bg=cyan bold"  # light blue background

# panes
set -g pane-border-style "fg=blue"           # blue border
set -g pane-active-border-style "fg=cyan"   # light blue active border

########################################################
# STATUS BAR CONFIGURATION
########################################################

# statusbar - use direct values for better SSH compatibility
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=blue"   # blue fg, no bg change

set -g status-left ""
set -g status-left-length 10

set -g status-right-style "fg=cyan"
set -g status-right '#{?#{==:#{client_key_table},off},#[fg=red bold]F12>outer #[default],#{?#{==:#{pane_current_command},ssh},#[fg=green]F12>inner #[default],}}#[fg=cyan]%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style "fg=black bg=cyan"
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style "fg=blue bg=black"
setw -g window-status-format " #I #[fg=white]#W #[fg=cyan]#F "

setw -g window-status-bell-style "fg=yellow bg=blue bold"

# messages
set -g message-style "fg=blue bg=cyan bold"

########################################################
# NESTED TMUX PASSTHROUGH (F12 toggle)
########################################################

# F12 enters passthrough: outer tmux stops intercepting keys,
# all input goes directly to inner tmux. Status bar turns red.
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=red bold" \;\
  refresh-client -S

# F12 again exits passthrough: outer tmux regains control
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# Forward CSI u keys through passthrough mode (off table)
# Without these, user-keys (User0/User1) are decoded but can't be re-encoded
# for the inner pane, so they get silently dropped.
bind -T off User0  send-keys "\e[13;2u"
bind -T off User1  send-keys "\e[9;2u"
bind -T off S-Enter send-keys "\e[13;2u"
bind -T off S-Tab  send-keys "\e[9;2u"

# Auto-disable passthrough when a pane exits (e.g. SSH connection closes)
set-hook -g pane-exited 'if -F "#{==:#{client_key_table},off}" "set -u prefix; set -u key-table; set -u status-style; refresh-client -S" ""'
set-hook -g pane-died 'if -F "#{==:#{client_key_table},off}" "set -u prefix; set -u key-table; set -u status-style; refresh-client -S" ""'

# Auto-disable passthrough when inner tmux signals detach via pane title
set-hook -g pane-title-changed 'if -F "#{&&:#{==:#{client_key_table},off},#{==:#{pane_title},__PASSTHROUGH_OFF__}}" "set -u prefix; set -u key-table; set -u status-style; refresh-client -S" ""'

# Simplified mouse settings for better SSH compatibility
# (mouse already enabled above)
