[project]
name = "scholar-fetch"
version = "0.1.0"
description = "Open-access failover chain: find and fetch the text of a cited paper or page, politely"
requires-python = ">=3.12"
dependencies = ["requests>=2.32", "urllib3>=2.3", "pypdf[crypto]>=5"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scholar_fetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: hits the real internet (arXiv, Unpaywall); run with -m live"]
